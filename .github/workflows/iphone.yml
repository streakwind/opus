name: iPhone
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
      - name: Build for iPhone Simulator
        run: ./scripts/build-iphone.sh simulator
      - name: Check device build
        run: |
          xcodebuild -project Apple/Opus.xcodeproj -scheme 'Opus iPhone' \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath /tmp/opus-iphone-device CODE_SIGNING_ALLOWED=NO build
      - name: Run phone UI smoke test
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d.get("isAvailable") and d["name"].startswith("iPhone")))')
          xcodebuild -project Apple/Opus.xcodeproj -scheme 'Opus iPhone' \
            -destination "platform=iOS Simulator,id=$device" \
            -resultBundlePath /tmp/OpusPhoneUI.xcresult CODE_SIGNING_ALLOWED=NO test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Opus-phone-ui-results
          path: /tmp/OpusPhoneUI.xcresult
